<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdák</title>
  </head>
  <body>
    <table id="table-characters" cellspacing="0" cellpadding="6">
      <thead>

          <th>Verdák</th>

        </tr>

      <tbody>

          <td class="car">Villám McQueen</td>

          <td><button class="delete">x</button></td>

        <tr>

          <td>Optimus Prime</td>
          <td><button class="delete">x</button></td>
        </tr>
        <tr>
          <td class="car">Matuka</td>

          <td><button class="delete">x</button></td>
        </tr>
        <tr>
          <td class="car">Joe Komposztor</td>
          <td>Szulejman</td>
          <td><button class="delete">x</button></td>
        </tr>
        <tr>
          <td class="car">Sally</td>
          <td>Stohl András</td>
          <td><button class="delete">x</button></td>
        </tr>
      </tbody>
    </table>

    <style>
      .highlight {
        background: #fffb91;
      }
      button.delete {
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        padding: 0.3em 0.6em;
      }
    </style>

    <script src="index.js"></script>
